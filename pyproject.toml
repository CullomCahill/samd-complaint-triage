[project]
name = "samd-complaint-triage"
version = "0.1.0"
description = "AI-assisted complaint triage pipeline for a toy SaMD workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "python-dotenv",
]

[project.scripts]
run_pipeline = "run_pipeline:main"
complaint_triage = "pipeline.complaint_triage:main"
probability = "pipeline.probability:main"
severity = "pipeline.severity:main"
final_scoring = "pipeline.final_scoring:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["run_pipeline"]
packages = ["pipeline"]
