[project]
name = "samd-complaint-triage"
version = "0.1.0"
description = "AI-assisted complaint triage pipeline for a toy SaMD workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "python-dotenv",
]

[project.scripts]
run_pipeline = "run_pipeline:main"
complaint_triage = "complaint_triage:main"
probability = "probability:main"
severity = "severity:main"
final_scoring = "final_scoring:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "run_pipeline",
    "complaint_triage",
    "probability",
    "severity",
    "final_scoring",
]
